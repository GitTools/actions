name: prerelease

permissions:
  contents: read

on:
  release:
    types: [ prereleased ]

defaults:
  run:
    shell: pwsh

jobs:
  prerelease:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-26.04 ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - run: |
          npm ci --ignore-scripts
          npm run build:tools
          npm run build:agent:github
          npm run build:agent:azure
        name: Build code

      - name: Install GitVersion
        uses: ./gitversion/setup
        with:
          versionSpec: '7.0.x'
          includePrerelease: true

      - name: Use GitVersion
        id: gitversion # step id used as a reference for output values
        uses: ./gitversion/execute

      - name: Load TFX credentials
        id: tfx-creds
        uses: gittools/cicd/tfx-creds@35132578146a11af8758159e9a9d4f69c7041297 # v6
        with:
          op_service_account_token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Publish To Azure Marketplace
        id: publish-azure
        uses: ./.github/actions/publish-azure
        with:
          mode: 'test'
          major: ${{ steps.gitversion.outputs.major }}
          minor: ${{ steps.gitversion.outputs.minor }}
          patch: ${{ steps.gitversion.outputs.patch }}
          token: ${{ steps.tfx-creds.outputs.tfx_token }}

      - name: Load GitHub App credentials
        id: github-app-creds
        uses: gittools/cicd/github-app-creds@35132578146a11af8758159e9a9d4f69c7041297 # v6
        with:
          op_service_account_token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Generate GitHub App Release Token
        id: release-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          owner: gittools
          repositories: |
            actions
            actions-test
          client-id: ${{ steps.github-app-creds.outputs.gh_app_client_id }}
          private-key: ${{ steps.github-app-creds.outputs.gh_app_private_key }}
          permission-actions: write
          permission-contents: write
          permission-workflows: write

      - name: Delay before triggering update examples (actions-test)
        run: Start-Sleep -Seconds 30

      - name: Trigger Update Examples version (actions-test)
        id: get-tags
        uses: ./.github/actions/trigger-action-test
        with:
          mode: 'test'
          majorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}
          token: ${{ steps.release-token.outputs.token }}
