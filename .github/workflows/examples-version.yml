name: Update examples version

permissions:
  contents: read

on:
  repository_dispatch:
    types: [ update-examples ]

defaults:
  run:
    shell: pwsh

jobs:
  update-examples-version:
    if: ${{ github.event_name == 'repository_dispatch' }}
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: gittools/cicd/checkout@35132578146a11af8758159e9a9d4f69c7041297 # v6
        with:
          op_service_account_token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          fetch-depth: 1

      - run: |
          . .\utilities.ps1 # Import the functions

          $oldTag = "${{ github.event.client_payload.oldTag }}"
          $newTag = "${{ github.event.client_payload.newTag }}"
          echo "Updating examples version to $newTag"
          echo "Old version: $oldTag"
          echo "New version: $newTag"

          dir -r .\docs\**\*.md   | % { update-files $_ -OldVersion $oldTag -NewVersion $newTag }
          dir -r .github\**\*.yml | % { update-files $_ -OldVersion $oldTag -NewVersion $newTag }
          dir -r .azure\**\*.yml  | % { update-files $_ -OldVersion $oldTag -NewVersion $newTag }

          npm version $newTag --no-git-tag-version --ignore-scripts --allow-same-version
        name: Update examples version

      - uses: gittools/cicd/git-commit-push@35132578146a11af8758159e9a9d4f69c7041297 # v6
        with:
          message: "update examples version to ${{ github.event.client_payload.newTag }}"
        name: Commit and push updated examples version
