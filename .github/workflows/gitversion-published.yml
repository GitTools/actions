name: Update GitVersion version

permissions:
  contents: read

on:
  repository_dispatch:
    types: [ gitversion-release-published ]

defaults:
  run:
    shell: pwsh

jobs:
  update-gitversion-version:
    if: github.event_name == 'repository_dispatch' && startsWith(github.event.client_payload.newTag, '7.')
    runs-on: ubuntu-24.04
    steps:
      - name: Load GitHub App credentials
        id: github-app-creds
        uses: gittools/cicd/github-app-creds@824c3d773fb5d1b00c26b474ae88b7ce9ae555ee # v5
        with:
          op_service_account_token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          owner: gittools
          repositories: actions
          app-id: ${{ steps.github-app-creds.outputs.gh_app_id }}
          private-key: ${{ steps.github-app-creds.outputs.gh_app_private_key }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Select the published GitVersion 7 test baseline
        env:
          GITVERSION_RELEASE_TAG: ${{ github.event.client_payload.newTag }}
        run: node scripts/update-gitversion-version.mjs

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "update GitVersion version to ${{ github.event.client_payload.newTag }}"
          author: 'gittools-bot <gittoolsbot@outlook.com>'
          committer: 'gittools-bot <gittoolsbot@outlook.com>'
          branch: "update/gitversion-${{ github.event.client_payload.newTag }}"
          base: main
          delete-branch: true
          labels: dependencies
          title: "Update GitVersion version to ${{ github.event.client_payload.newTag }}"
          body: |
            Updates the published-package validation baseline in `scripts/gitversion-test.json`
            following publication of GitVersion `${{ github.event.client_payload.newTag }}`.

            Triggered by the `gitversion-release-published` repository dispatch.
