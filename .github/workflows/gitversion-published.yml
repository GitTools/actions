name: Update GitVersion version

permissions:
  contents: read

on:
  repository_dispatch:
    types: [ gitversion-release-published ]

defaults:
  run:
    shell: pwsh

jobs:
  update-gitversion-version:
    if: ${{ github.event_name == 'repository_dispatch' }}
    runs-on: ubuntu-26.04
    steps:
      - name: Load GitHub App credentials
        id: github-app-creds
        uses: gittools/cicd/github-app-creds@824c3d773fb5d1b00c26b474ae88b7ce9ae555ee # v5
        with:
          op_service_account_token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          owner: gittools
          repositories: actions
          app-id: ${{ steps.github-app-creds.outputs.gh_app_id }}
          private-key: ${{ steps.github-app-creds.outputs.gh_app_private_key }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - id: update-version
        env:
          RELEASE_TAG: ${{ github.event.client_payload.newTag }}
        run: |
          . ./utilities.ps1 # Import the functions

          $version = $env:RELEASE_TAG
          if ($version -notmatch '\A7\.0\.(0|[1-9][0-9]*)\z') {
            Write-Output 'Skipping release outside the supported stable GitVersion 7.0 line.'
            return
          }

          $oldTag = extract-version
          $newTag = ($version -split '\.')[0,1] -join '.' | % { "$_.x" }

          if ($oldTag -eq $newTag) {
            Write-Output "The current range $oldTag already includes $version."
            return
          }

          echo "Updating GitVersion version to $newTag"
          echo "Old version: $oldTag"
          echo "New version: $newTag"

          $oldTag = [regex]::Escape($oldTag)
          dir -r .\docs\**\*.md   | % { update-files $_ -OldVersion $oldTag -NewVersion $newTag }
          dir -r .github\**\*.yml | % { update-files $_ -OldVersion $oldTag -NewVersion $newTag }
          dir -r .azure\**\*.yml  | % { update-files $_ -OldVersion $oldTag -NewVersion $newTag }
          update-files src/__tests__/tools/gitversion/compatibility.spec.ts -OldVersion $oldTag -NewVersion $newTag
          update-files src/__tests__/tools/gitversion/runner.spec.ts -OldVersion $oldTag -NewVersion $newTag

          "release-tag=$version" >> $env:GITHUB_OUTPUT

        name: Update GitVersion version

      - name: Create Pull Request
        if: steps.update-version.outputs.release-tag != ''
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "update GitVersion version to ${{ steps.update-version.outputs.release-tag }}"
          author: 'gittools-bot <gittoolsbot@outlook.com>'
          committer: 'gittools-bot <gittoolsbot@outlook.com>'
          branch: "update/gitversion-${{ steps.update-version.outputs.release-tag }}"
          base: main
          delete-branch: true
          labels: dependencies
          title: "Update GitVersion version to ${{ steps.update-version.outputs.release-tag }}"
          body: |
            Updates the GitVersion version references in `docs`, `.github`, and `.azure`
            following the publication of GitVersion `${{ steps.update-version.outputs.release-tag }}`.

            Triggered by the `gitversion-release-published` repository dispatch.
